{% extends 'base.html' %}{% block body %}<h1>이력</h1><div class="card"><table><tr><th>시간</th><th>관리자</th><th>자산번호</th><th>자산명</th><th>내용</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.display_name or '-'}}</td><td>{{r.asset_no or '-'}}</td><td>{{r.entity_name or '-'}}</td><td><button class="link" onclick='aud({{r|tojson}})'>{{r.action}} ▶</button></td></tr>{% endfor %}</table></div><div id="hs" class="shade"></div><aside id="rd" class="drawer rightd"><button class="x" onclick="closeAud()">×</button><div id="am"></div><div class="compare"><div><h3>변경 전</h3><div id="bv"></div></div><div><h3>변경 후</h3><div id="av"></div></div></div></aside>{% endblock %}{% block script %}<script>function J(x){try{return x?JSON.parse(x):{}}catch{return {}}}function aud(r){let b=J(r.before_data),a=J(r.after_data),ks=[...new Set([...Object.keys(b),...Object.keys(a)])],x='',y='';for(let k of ks){let c=String(b[k]??'-')!==String(a[k]??'-');x+=`<div class="cmp ${c?'old':''}"><b>${k}</b><span>${b[k]??'-'}</span></div>`;y+=`<div class="cmp ${c?'new':''}"><b>${k}</b><span>${a[k]??'-'}</span></div>`}am.innerHTML=`<h2>${r.asset_no||''} ${r.entity_name||''} · ${r.action}</h2>${r.reason?`<p>${r.reason}</p>`:''}`;bv.innerHTML=x;av.innerHTML=y;rd.classList.add('open');hs.classList.add('open')}function closeAud(){rd.classList.remove('open');hs.classList.remove('open')}hs.onclick=closeAud</script>{% endblock %}
