{% extends 'base.html' %}{% block body %}<div class="head"><h1>자산 규칙</h1><div class="action-bar"><button form="rulesForm">전체 적용</button><a class="btn gray" href="/assets">자산 목록</a></div></div><div class="rules-grid"><section class="card rules-purpose"><h2>용도 / 자산번호</h2><form method="post" action="/purposes" class="purpose-new"><label>용도명<input name="name" required></label><label>자산번호<input name="asset_prefix" placeholder="NA-S" required></label><label class="layout-check-label">레이아웃<input class="layout-checkbox" type="checkbox" name="server_target"></label><button>추가</button></form><form id="rulesForm" method="post" action="/rules"><table><tr><th>용도명</th><th>자산번호</th><th>생성된 규칙 수</th><th>레이아웃</th><th>사용</th></tr>{% for p in purposes %}<tr><td><input type="hidden" name="purpose_id" value="{{p.id}}"><input name="name_{{p.id}}" value="{{p.name}}"></td><td><input name="prefix_{{p.id}}" value="{{p.asset_prefix}}"></td><td class="seq">{{'%03d'|format(p.next_sequence)}}</td><td><input type="checkbox" name="server_{{p.id}}" {% if p.server_target%}checked{%endif%}></td><td><input type="checkbox" name="enabled_{{p.id}}" {% if p.enabled%}checked{%endif%}></td></tr>{% endfor %}</table></form></section><section class="card"><h2>장소</h2><form method="post" action="/locations" class="location-new"><label>장소명<input name="name" required></label><button>추가</button></form>{% for l in locations %}<form method="post" action="/locations/{{l.id}}" class="location-item"><input name="name" value="{{l.name}}"><label class="check"><input type="checkbox" name="enabled" {% if l.enabled%}checked{%endif%}>사용</label><button>저장</button></form>{% endfor %}</section><section class="card"><h2>평가 범위</h2><div class="eval-side"><label>최소<input form="rulesForm" name="eval_min" type="number" value="{{mn}}"></label><label>최대<input form="rulesForm" name="eval_max" type="number" value="{{mx}}"></label></div></section></div>{% endblock %}
